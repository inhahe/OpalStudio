[build-system]
# 77: the first to take a license expression.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opal-studio"
version = "0.23.0"
description = "Drive the Opal Studio graphics editor from Python"
readme = "API.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
packages = ["opal"]

[tool.setuptools.package-data]
opal = ["__init__.pyi", "py.typed"]
