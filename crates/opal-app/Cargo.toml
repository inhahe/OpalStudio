[package]
name = "opal-app"
description = "Opal Studio, a 2D graphics editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "opal-studio"
path = "src/main.rs"

[dependencies]
opal-color = { workspace = true }
opal-core = { workspace = true }
opal-io = { workspace = true }
half = { workspace = true }
bytemuck = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
eframe = "0.37"
egui_tiles = "0.18"
rfd = "0.17"
directories = "6"
mimalloc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Foundation"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "eframe"] }
image = { workspace = true }
