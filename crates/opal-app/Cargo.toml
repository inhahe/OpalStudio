[package]
name = "opal-app"
description = "Opal Studio, a 2D graphics editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# `cargo run` starts the editor, not its launcher for command prompts.
default-run = "opal-studio"

[[bin]]
name = "opal-studio"
path = "src/main.rs"

# Copied beside the editor as opal-studio.com, which a command prompt waits for.
[[bin]]
name = "opal-studio-console"
path = "src/console_launcher.rs"

[dependencies]
opal-color = { workspace = true }
opal-core = { workspace = true }
opal-io = { workspace = true }
half = { workspace = true }
bytemuck = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
eframe = "0.37"
egui_tiles = "0.18"
rfd = "0.17"
directories = "6"
mimalloc = { workspace = true }
rayon = { workspace = true }
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
interprocess = "2.4.7"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
# The version eframe uses, for its Windows message hook.
winit = "0.30"
windows = { version = "0.62", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "eframe"] }
image = { workspace = true }
