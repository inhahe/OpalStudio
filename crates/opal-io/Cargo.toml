[package]
name = "opal-io"
description = "Opal Studio's file formats: image import and export, and the native .opal format"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
opal-core = { workspace = true }
opal-color = { workspace = true }
half = { workspace = true }
bytemuck = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
image = { workspace = true }
png = { workspace = true }
zip = { workspace = true }
# Metadata (see `metadata`): XMP's XML (no DTDs), IIM's and Extended XMP's digests, PNG's
# compressed text and its chunks' checksums.
roxmltree = "0.21"
md-5 = "0.10"
flate2 = "1"
crc32fast = "1"
